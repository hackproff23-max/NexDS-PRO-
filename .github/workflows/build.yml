name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Baixar core melonDS (libretro, arm64)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a core_tmp
          curl -fL -o core.zip https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/melonds_libretro_android.so.zip
          unzip -o core.zip -d core_tmp
          cp "$(find core_tmp -name '*.so' | head -1)" app/src/main/jniLibs/arm64-v8a/libretro_core.so
          ls -l app/src/main/jniLibs/arm64-v8a

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: NexDS-PRO-debug
          path: app/build/outputs/apk/debug/*.apk
